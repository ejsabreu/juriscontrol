       window.App — a conversão para import/export na migração é mecânica.

       A ordem abaixo é a de dependência conceitual. Nenhum arquivo depende
       de outro em tempo de DEFINIÇÃO (só em tempo de chamada), então a
       ordem é uma conveniência de leitura, não uma exigência frágil.
       ====================================================================== -->
